<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Tarefas</title></head>
<body>
<nav class="border-bottom py-2 mb-3"><div class="container d-flex align-items-center gap-2">
  <strong class="me-auto">Tarefas</strong>
  <span id="usuarioNome" class="text-muted small"></span>
  <a href="creditos.html" class="btn btn-sm btn-outline-dark">Créditos</a>
  <button id="btnSair" class="btn btn-sm btn-dark">Sair</button>
</div></nav>

<div class="container">
  <div id="bannerAtraso" class="alert alert-secondary d-none"></div>
  <div class="d-flex justify-content-between mb-2">
    <h2 class="h5 m-0">Minhas atividades</h2>
    <button id="btnNova" class="btn btn-dark btn-sm">+ Nova atividade</button>
  </div>
  <div class="table-responsive">
    <table class="table table-sm align-middle">
      <thead><tr><th>Título</th><th>Descrição</th><th>Criada em</th><th>Conclusão</th><th>Status</th><th class="text-end">Ações</th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalTarefa" tabindex="-1"><div class="modal-dialog">
  <form id="formTarefa" class="modal-content">
    <div class="modal-header"><h5 id="tituloModal" class="modal-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div id="msgTarefa" class="alert alert-secondary py-2 d-none"></div>
      <input type="hidden" name="id">
      <div class="mb-2"><label class="form-label">Título</label><input name="titulo" class="form-control" maxlength="150" required></div>
      <div class="mb-2"><label class="form-label">Descrição</label><textarea name="descricao" class="form-control" rows="3"></textarea></div>
      <div class="row g-2">
        <div class="col-6" id="boxCriacao"><label class="form-label">Data de criação</label><input id="dataCriacao" class="form-control" disabled></div>
        <div class="col-6"><label class="form-label">Data de conclusão</label><input name="data_conclusao" type="date" class="form-control" required></div>
        <div class="col-12"><label class="form-label">Status</label>
          <select name="status" class="form-select"><option value="em_aberto">Em aberto</option><option value="concluida">Concluída</option></select>
          <div class="form-text">"Em atraso" é definido automaticamente quando o prazo passa.</div>
        </div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-dark">Salvar</button></div>
  </form>
</div></div>

<div class="modal fade" id="modalAviso" tabindex="-1"><div class="modal-dialog modal-sm modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Atenção</h5></div>
  <div class="modal-body" id="textoAviso"></div>
  <div class="modal-footer"><button class="btn btn-dark btn-sm" data-bs-dismiss="modal">OK</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/tarefas.js"></script>
</body></html>
